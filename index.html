<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11100e" />
    <meta name="description" content="ACTUAL is an independent company." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACTUAL — Independent Company" />
    <meta property="og:description" content="ACTUAL is an independent company." />
    <meta property="og:url" content="https://actual.ltd/" />
    <meta property="og:image" content="https://actual.ltd/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ACTUAL over a warm black-and-bone dithered field." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://actual.ltd/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ACTUAL — Independent Company</title>
  </head>
  <body>
    <main class="site-shell" aria-label="ACTUAL company page">
      <div class="visual-layer" id="visual-layer" aria-hidden="true">
        <div class="visual-fallback"></div>
      </div>

      <header class="masthead">
        <div class="record-meta" aria-label="Visual record">
          <span id="record-index">[001/003]</span>
          <span id="record-label">CONTOUR</span>
          <span class="density-ramp" aria-hidden="true">.:-=+*#%@</span>
        </div>
        <button class="motion-control" id="motion-control" type="button" aria-pressed="true">
          MOTION—ON
        </button>
      </header>

      <section class="identity" aria-labelledby="actual-wordmark">
        <button
          class="wordmark"
          id="actual-wordmark"
          type="button"
          aria-expanded="false"
          aria-controls="company-description"
        >
          ACTUAL
        </button>
        <p class="company-description" id="company-description">
          <span aria-hidden="true">[</span> INDEPENDENT COMPANY <span aria-hidden="true">]</span>
        </p>
      </section>

      <footer class="footer">
        <span class="edition" aria-hidden="true">INDEX 001</span>
        <a class="email" href="mailto:hello@actual.ltd">
          <span>hello@actual.ltd</span><span class="email-arrow" aria-hidden="true">↗</span>
        </a>
      </footer>

      <noscript>
        <style>
          .motion-control { display: none; }
          .company-description { opacity: 1; transform: none; }
        </style>
      </noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
