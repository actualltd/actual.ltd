<!doctype html>
<html lang="en" class="no-js" data-scene="0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3155d5" />
    <meta name="description" content="Official website of ACTUAL LTD." />
    <link rel="canonical" href="https://actual.ltd/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACTUAL" />
    <meta property="og:description" content="ACTUAL" />
    <meta property="og:url" content="https://actual.ltd/" />
    <meta property="og:image" content="https://actual.ltd/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ACTUAL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://actual.ltd/og.png" />
    <title>ACTUAL</title>
    <script>
      document.documentElement.className = "has-js";
      (() => {
        const files = [
          "/animals/01-oryx.webp",
          "/animals/02-crane.webp",
          "/animals/03-manta.webp",
          "/animals/04-tiger.webp",
          "/animals/05-sailfish.webp"
        ];
        let previous = -1;
        try {
          const saved = sessionStorage.getItem("actual-scene");
          previous = saved === null ? -1 : Number(saved);
        } catch {}
        const choices = [0, 1, 2, 3, 4].filter((value) => value !== previous);
        let random = Math.floor(Math.random() * choices.length);
        if (window.crypto && window.crypto.getRandomValues) {
          const entropy = new Uint32Array(1);
          window.crypto.getRandomValues(entropy);
          random = entropy[0] % choices.length;
        }
        const selected = choices[random] ?? 0;
        window.__ACTUAL_SCENE__ = selected;
        document.documentElement.dataset.scene = String(selected);
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = files[selected];
        document.head.append(preload);
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ACTUAL LTD.",
        "legalName": "ACTUAL LTD.",
        "url": "https://actual.ltd/",
        "email": "hello@actual.ltd",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "25 Chidlom, Ploenchit, Lumpini, Patumwan",
          "addressLocality": "Bangkok",
          "postalCode": "10330",
          "addressCountry": "TH"
        }
      }
    </script>
  </head>
  <body>
    <main class="site" id="site" data-ready="false" data-switching="false">
      <div class="visual" aria-hidden="true">
        <img id="hero-image" width="1536" height="1024" alt="" decoding="async" fetchpriority="high" />
      </div>

      <button class="scene-control" id="scene-control" type="button" aria-label="Show another animal">
        <span id="scene-index">01</span> / 05
      </button>

      <h1 class="wordmark">ACTUAL</h1>

      <a class="contact" href="mailto:hello@actual.ltd">HELLO@ACTUAL.LTD ↗</a>
      <p class="visually-hidden" id="visual-description" aria-live="polite"></p>

      <noscript>
        <img class="noscript-image" src="/animals/01-oryx.webp" alt="An Arabian oryx walking in side profile" />
        <style>.visual{display:none}.noscript-image{display:block}.site{opacity:1}</style>
      </noscript>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
