<!doctype html>
<html lang="en" class="no-js" data-scene="0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Official website of ACTUAL LTD." />
    <link rel="canonical" href="https://actual.ltd/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACTUAL" />
    <meta property="og:description" content="ACTUAL" />
    <meta property="og:url" content="https://actual.ltd/" />
    <meta property="og:image" content="https://actual.ltd/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ACTUAL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://actual.ltd/og.png" />
    <title>ACTUAL</title>
    <script>
      document.documentElement.className = "has-js";
      (() => {
        const files = [
          ["/animals/posters/portrait-01-oryx.png", "/animals/posters/landscape-01-oryx.png", "/animals/posters/cutout-01-oryx.png"],
          ["/animals/posters/portrait-02-crane.png", "/animals/posters/landscape-02-crane.png", "/animals/posters/cutout-02-crane.png"],
          ["/animals/posters/portrait-03-stag.png", "/animals/posters/landscape-03-stag.png", "/animals/posters/cutout-03-stag.png"],
          ["/animals/posters/portrait-04-tiger.png", "/animals/posters/landscape-04-tiger.png", "/animals/posters/cutout-04-tiger.png"],
          ["/animals/posters/portrait-05-sailfish.png", "/animals/posters/landscape-05-sailfish.png", "/animals/posters/cutout-05-sailfish.png"]
        ];
        let previous = -1;
        try {
          const saved = sessionStorage.getItem("actual-scene");
          previous = saved === null ? -1 : Number(saved);
        } catch {}
        const choices = [0, 1, 2, 3, 4].filter((value) => value !== previous);
        let random = Math.floor(Math.random() * choices.length);
        if (window.crypto && window.crypto.getRandomValues) {
          const entropy = new Uint32Array(1);
          window.crypto.getRandomValues(entropy);
          random = entropy[0] % choices.length;
        }
        const selected = choices[random] ?? 0;
        window.__ACTUAL_SCENE__ = selected;
        document.documentElement.dataset.scene = String(selected);
        const portrait = matchMedia("(max-aspect-ratio: 4/5)").matches;
        [files[selected][portrait ? 0 : 1], files[selected][2]].forEach((href) => {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = href;
          document.head.append(preload);
        });
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ACTUAL LTD.",
        "legalName": "ACTUAL LTD.",
        "url": "https://actual.ltd/",
        "email": "hello@actual.ltd",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "25 Chidlom, Ploenchit, Lumpini, Patumwan",
          "addressLocality": "Bangkok",
          "postalCode": "10330",
          "addressCountry": "TH"
        }
      }
    </script>
  </head>
  <body>
    <main class="site" id="site" data-ready="false" data-switching="false">
      <div class="visual" aria-hidden="true">
        <img class="poster-background" id="hero-background" alt="" decoding="async" fetchpriority="high" />
        <img class="animal" id="hero-animal" alt="" decoding="async" fetchpriority="high" />
      </div>

      <div class="bottom-overlay">
        <div class="wordmark" aria-hidden="true">ACTUAL</div>
        <button class="scene-control" id="scene-control" type="button" aria-label="Show another animal">
          <span id="scene-index">#000</span>
          <span id="scene-name">ORYX</span>
          <span class="scene-next" aria-hidden="true">NEXT</span>
        </button>
      </div>

      <h1 class="visually-hidden">ACTUAL</h1>

      <a class="contact" href="mailto:hello@actual.ltd">HELLO@ACTUAL.LTD ↗</a>
      <p class="visually-hidden" id="visual-description" aria-live="polite"></p>

      <noscript>
        <img class="noscript-image" src="/animals/posters/portrait-01-oryx.png" alt="An Arabian oryx walking with its head turned away" />
        <style>.visual{display:none}.noscript-image{display:block}.site{opacity:1}</style>
      </noscript>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
