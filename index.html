<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e0d4" />
    <meta name="description" content="ACTUAL is an independent company. Three studies in force, motion, and presence." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACTUAL — Independent Company" />
    <meta property="og:description" content="Three studies in force, motion, and presence by ACTUAL." />
    <meta property="og:url" content="https://actual.ltd/" />
    <meta property="og:image" content="https://actual.ltd/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A mixed-dither collage of Hokusai's wave, a Sharaku actor, and a conch shell." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://actual.ltd/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ACTUAL — Independent Company</title>
  </head>
  <body>
    <main class="site-shell" aria-label="ACTUAL company page">
      <div class="visual-layer" id="visual-layer" aria-hidden="true">
        <div class="visual-fallback"></div>
      </div>

      <header class="masthead">
        <div class="record-meta" aria-label="Visual record">
          <span id="record-index">[001/003]</span>
          <span id="record-label">FORCE</span>
          <span class="density-ramp" aria-hidden="true">.:-=+*#%@</span>
        </div>
        <button class="motion-control" id="motion-control" type="button" aria-pressed="true">
          MOTION—ON
        </button>
      </header>

      <h1 class="visually-hidden">ACTUAL</h1>

      <section class="identity" aria-label="Artwork record" aria-live="polite">
        <div class="scene-copy">
          <span class="scene-step" id="scene-step">001 / FORCE</span>
          <span class="scene-line" id="scene-line">THE WORLD ARRIVES IN WAVES.</span>
          <span class="scene-caption">
            <span id="scene-title">THE GREAT WAVE</span>
            <span id="scene-artist">KATSUSHIKA HOKUSAI — C. 1830–32</span>
          </span>
        </div>
      </section>

      <div class="scroll-cue" aria-hidden="true">
        <span class="scroll-label scroll-label-desktop">SCROLL</span>
        <span class="scroll-label scroll-label-touch">SWIPE</span>
        <span class="scroll-rule"></span>
        <span class="scroll-index" id="scroll-index">002</span>
      </div>

      <footer class="footer">
        <div class="edition">
          <button class="actual-mark" id="actual-wordmark" type="button" aria-expanded="false" aria-controls="company-description">
            <span>ACTUAL</span>
            <span class="company-description" id="company-description">INDEPENDENT COMPANY</span>
          </button>
          <a
            class="source-credit"
            id="source-credit"
            href="https://www.metmuseum.org/art/collection/search/56353"
            target="_blank"
            rel="noreferrer"
          >3 SOURCES — OPEN ACCESS</a>
        </div>
        <a class="email" href="mailto:hello@actual.ltd">
          <span>hello@actual.ltd</span><span class="email-arrow" aria-hidden="true">↗</span>
        </a>
      </footer>

      <noscript>
        <style>
          .motion-control { display: none; }
          .company-description { opacity: 1; transform: none; }
        </style>
      </noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
